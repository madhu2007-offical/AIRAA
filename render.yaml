services:
  - type: web
    name: airaa-backend
    env: python
    buildCommand: pip install -r requirements.txt && python backend/data/generate_synthetic_reports.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        value: "" # Overwrite in Render dashboard with your actual Gemini API key if available
